<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>🐟 Fish Market – риболовні товари</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: 'Segoe UI', sans-serif; background:#f0f2f5; color:#1e2a3a; }
        header { background: linear-gradient(135deg,#1e3c2c,#2a5a3a); color:white; padding:1rem 0; }
        .container { max-width:1300px; margin:0 auto; padding:0 24px; }
        .header-flex { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:15px; }
        .logo h1 { font-size:1.8rem; }
        .user-info { background:rgba(255,255,255,0.15); padding:8px 20px; border-radius:40px; display:flex; align-items:center; gap:20px; }
        .cart-icon { position:relative; cursor:pointer; font-size:1.6rem; }
        .cart-count { position:absolute; top:-10px; right:-15px; background:#e67e22; color:white; border-radius:30px; width:22px; height:22px; font-size:0.7rem; display:flex; align-items:center; justify-content:center; }
        button { cursor:pointer; border:none; font-weight:500; transition:0.2s; }
        button:hover { opacity:0.85; }
        .category-bar { background:white; padding:12px 0; margin-bottom:24px; box-shadow:0 2px 8px rgba(0,0,0,0.05); }
        .category-buttons { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
        .cat-btn { background:#ecf0f1; padding:8px 24px; border-radius:40px; font-size:0.9rem; font-weight:600; color:#2c3e50; cursor:pointer; }
        .cat-btn.active { background:#2c3e50; color:white; }
        .sort-panel { text-align:right; margin-bottom:24px; }
        .sort-panel select { padding:8px 16px; border-radius:30px; border:1px solid #ccc; background:white; }
        .products-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:28px; margin-bottom:50px; }
        .product-card { background:white; border-radius:20px; padding:18px; text-align:center; box-shadow:0 8px 20px rgba(0,0,0,0.08); transition:0.25s; }
        .product-card:hover { transform:translateY(-6px); }
        .product-img { width:100%; height:180px; object-fit:contain; background:#fafafa; border-radius:16px; }
        .product-title { font-weight:700; font-size:1rem; margin:12px 0 6px; }
        .product-price { font-size:1.4rem; font-weight:800; color:#e67e22; margin:8px 0; }
        .buy-btn { background:#27ae60; color:white; padding:10px 0; border-radius:40px; width:100%; margin-top:8px; }
        .admin-edit-btn { background:#2980b9; color:white; padding:10px 0; border-radius:40px; width:100%; margin-top:5px; }
        .cart-sidebar { position:fixed; right:-420px; top:0; width:400px; height:100%; background:white; box-shadow:-4px 0 20px rgba(0,0,0,0.2); transition:0.3s; z-index:1100; padding:24px; overflow-y:auto; }
        .cart-sidebar.open { right:0; }
        .cart-item { border-bottom:1px solid #ecf0f1; padding:12px 0; display:flex; justify-content:space-between; align-items:center; }
        .cart-item-actions button { background:#e74c3c; color:white; border-radius:50%; width:28px; height:28px; margin-left:6px; }
        .checkout-form input { width:100%; padding:12px; margin:10px 0; border:1px solid #ddd; border-radius:30px; }
        .checkout-btn { background:#e67e22; color:white; width:100%; padding:12px; border-radius:40px; font-weight:bold; }
        .admin-modal { display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:white; padding:28px; border-radius:28px; z-index:1200; width:460px; }
        .admin-modal input, .admin-modal select, .admin-modal textarea { width:100%; margin-bottom:14px; padding:10px; border-radius:20px; border:1px solid #ccc; }
        .overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1150; }
        footer { background:#1e2f3c; color:white; text-align:center; padding:20px; margin-top:40px; }
        #login-btn, #logout-btn { background:#f39c12; padding:5px 18px; border-radius:30px; font-weight:bold; border:none; cursor:pointer; }
        .admin-float { position:fixed; bottom:24px; right:24px; background:#e67e22; color:white; width:60px; height:60px; border-radius:60px; font-size:28px; display:none; align-items:center; justify-content:center; cursor:pointer; z-index:1000; }

        /* Стилі для модального вікна логіну */
        .login-modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 28px; border-radius: 28px; z-index: 1250; width: 360px; box-shadow: 0 20px 35px rgba(0,0,0,0.3); }
        .login-modal h3 { margin-bottom: 20px; text-align: center; }
        .login-modal input { width: 100%; padding: 12px; margin: 12px 0; border: 1px solid #ccc; border-radius: 30px; }
        .login-modal button { width: 100%; padding: 12px; background: #2c3e50; color: white; border-radius: 30px; margin-top: 12px; }
        .login-modal .close-login { background: #e74c3c; margin-top: 8px; }
    </style>
</head>
<body>

<header>
    <div class="container header-flex">
        <div class="logo"><h1>🎣 Fish Market</h1><p>Справжня риболовля</p></div>
        <div class="user-info">
            <span id="user-name">Не авторизовано</span>
            <button id="login-btn">Увійти</button>
            <div class="cart-icon" id="cart-icon">🛒 <span id="cart-count" class="cart-count">0</span></div>
        </div>
    </div>
</header>

<div class="category-bar"><div class="container category-buttons" id="category-buttons"></div></div>

<div class="container">
    <div class="sort-panel">
        <label>📊 Сортувати: </label>
        <select id="sort-select">
            <option value="">За замовчуванням</option>
            <option value="asc">💰 Від дешевших до дорожчих</option>
            <option value="desc">💰 Від дорожчих до дешевших</option>
        </select>
    </div>
    <div id="products-container" class="products-grid">Завантаження товарів...</div>
</div>

<div id="cart-sidebar" class="cart-sidebar">
    <div class="cart-header"><span>🐟 Кошик</span><span id="close-cart" style="cursor:pointer;">&times;</span></div>
    <div id="cart-items"></div>
    <div id="cart-total" class="cart-total"></div>
    <div class="checkout-form">
        <input type="text" id="address" placeholder="Адреса доставки" required>
        <button id="checkout-btn" class="checkout-btn">Оформити замовлення</button>
    </div>
</div>

<!-- Модалка для логіну -->
<div id="login-modal" class="login-modal">
    <h3>🔐 Вхід до Fish Market</h3>
    <input type="text" id="login-username" placeholder="Логін (admin або user)">
    <input type="password" id="login-password" placeholder="Пароль (admin123 або user123)">
    <button id="submit-login">Увійти</button>
    <button id="close-login-modal" class="close-login">Скасувати</button>
</div>
<div id="login-overlay" class="overlay"></div>

<div id="admin-modal" class="admin-modal">
    <h3>➕ Новий товар</h3>
    <input type="text" id="prod-name" placeholder="Назва">
    <textarea id="prod-desc" placeholder="Опис"></textarea>
    <input type="number" id="prod-price" placeholder="Ціна">
    <select id="prod-type"><option value="ROD">Вудлище</option><option value="REEL">Котушка</option><option value="LINE">Шнур</option><option value="HOOK">Гачок</option><option value="LURE">Воблер</option></select>
    <input type="text" id="prod-image" placeholder="/images/назва.jpg">
    <input type="number" id="prod-stock" placeholder="Кількість">
    <button id="save-product-btn">Зберегти</button>
    <button id="close-modal-btn">Скасувати</button>
</div>
<div id="overlay" class="overlay"></div>
<div id="adminFloatBtn" class="admin-float">➕</div>
<footer>Fish Market © 2026</footer>

<script>
    // --- Глобальні змінні ---
    let token = null;
    let currentUser = null;
    let currentType = 'ROD';
    let currentSort = '';
    let cart = {};

    // --- DOM елементи ---
    const productsDiv = document.getElementById('products-container');
    const categoryContainer = document.getElementById('category-buttons');
    const cartSidebar = document.getElementById('cart-sidebar');
    const cartCountSpan = document.getElementById('cart-count');
    const userNameSpan = document.getElementById('user-name');
    const loginBtn = document.getElementById('login-btn');
    const adminFloat = document.getElementById('adminFloatBtn');

    // --- Елементи модалки логіну ---
    const loginModal = document.getElementById('login-modal');
    const loginOverlay = document.getElementById('login-overlay');
    const loginUsername = document.getElementById('login-username');
    const loginPassword = document.getElementById('login-password');
    const submitLoginBtn = document.getElementById('submit-login');
    const closeLoginBtn = document.getElementById('close-login-modal');

    // --- Helper ---
    function getAuthHeaders() {
        return token ? { 'Authorization': `Bearer ${token}` } : {};
    }

    // --- Функція логіну (отримує username, password) ---
    async function performLogin(username, password) {
        try {
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            if (!response.ok) {
                alert('Невірний логін або пароль');
                return false;
            }
            const data = await response.json();
            token = data.token;
            localStorage.setItem('token', token);
            currentUser = { username: data.username, role: data.role };
            localStorage.setItem('currentUser', JSON.stringify(currentUser));
            updateUI();
            fetchProducts();   // перезавантажити товари (щоб показати кнопки видалення для адміна)
            closeLoginModal();
            alert(`Вітаємо, ${data.username}!`);
            return true;
        } catch (error) {
            console.error('Login error:', error);
            alert('Помилка з\'єднання з сервером');
            return false;
        }
    }

    // --- Вихід ---
    function logout() {
        token = null;
        localStorage.removeItem('token');
        localStorage.removeItem('currentUser');
        currentUser = null;
        updateUI();
        fetchProducts();   // оновити товари (прибрати кнопки адміна)
        alert('Ви вийшли з системи');
    }

    // --- Оновлення UI залежно від статусу авторизації ---
    function updateUI() {
        if (currentUser && token) {
            userNameSpan.innerText = `${currentUser.username} (${currentUser.role})`;
            loginBtn.innerText = 'Вийти';
            adminFloat.style.display = (currentUser.role === 'ADMIN') ? 'flex' : 'none';
        } else {
            userNameSpan.innerText = 'Не авторизовано';
            loginBtn.innerText = 'Увійти';
            adminFloat.style.display = 'none';
        }
    }

    // --- Обробник кнопки "Увійти/Вийти" (простий, без cloneNode) ---
    loginBtn.onclick = () => {
        if (currentUser && token) {
            logout();
        } else {
            // Показати модальне вікно логіну
            loginModal.style.display = 'block';
            loginOverlay.style.display = 'block';
            loginUsername.value = '';
            loginPassword.value = '';
            loginUsername.focus();
        }
    };

    // --- Функції керування модалкою логіну ---
    function closeLoginModal() {
        loginModal.style.display = 'none';
        loginOverlay.style.display = 'none';
    }

    submitLoginBtn.onclick = () => {
        const username = loginUsername.value.trim();
        const password = loginPassword.value.trim();
        if (!username || !password) {
            alert('Введіть логін та пароль');
            return;
        }
        performLogin(username, password);
    };

    closeLoginBtn.onclick = closeLoginModal;
    loginOverlay.onclick = closeLoginModal;

    // --- Відновлення сесії з localStorage ---
    function restoreSession() {
        const savedToken = localStorage.getItem('token');
        const savedUser = localStorage.getItem('currentUser');
        if (savedToken && savedUser) {
            token = savedToken;
            currentUser = JSON.parse(savedUser);
            updateUI();
        }
    }

    // --- Кошик (з localStorage) ---
    function loadCart() {
        const saved = localStorage.getItem('cart');
        if (saved) cart = JSON.parse(saved);
        else cart = {};
        updateCartDisplay();
    }

    function updateCartDisplay() {
        let total = 0, count = 0;
        const cartDiv = document.getElementById('cart-items');
        if (!cartDiv) return;
        cartDiv.innerHTML = '';
        for (const [id, item] of Object.entries(cart)) {
            count += item.quantity;
            total += item.price * item.quantity;
            const div = document.createElement('div');
            div.className = 'cart-item';
            div.innerHTML = `<div><strong>${escapeHtml(item.name)}</strong><br>${item.price}₴ x ${item.quantity}</div>
                <div class="cart-item-actions">
                    <button onclick="changeQuantity(${id}, -1)">-</button>
                    <button onclick="changeQuantity(${id}, 1)">+</button>
                    <button onclick="removeFromCart(${id})">🗑</button>
                </div>`;
            cartDiv.appendChild(div);
        }
        cartCountSpan.innerText = count;
        document.getElementById('cart-total').innerHTML = `Загальна сума: ${total} ₴`;
        localStorage.setItem('cart', JSON.stringify(cart));
    }

    function addToCart(product) {
        if (!cart[product.id]) cart[product.id] = { ...product, quantity: 0 };
        if (cart[product.id].quantity >= 3) { alert('Максимум 3 одиниці'); return; }
        cart[product.id].quantity++;
        updateCartDisplay();
    }

    window.changeQuantity = function(id, delta) {
        if (!cart[id]) return;
        let q = cart[id].quantity + delta;
        if (q < 1) delete cart[id];
        else if (q <= 3) cart[id].quantity = q;
        else alert('Не більше 3');
        updateCartDisplay();
    };
    window.removeFromCart = function(id) { delete cart[id]; updateCartDisplay(); };
    window.addToCart = addToCart;

    async function checkout() {
        if (!currentUser) { alert('Увійдіть, будь ласка'); return; }
        const address = document.getElementById('address').value.trim();
        if (!address) { alert('Введіть адресу доставки'); return; }
        const items = Object.values(cart).map(i => ({ productId: i.id, quantity: i.quantity }));
        if (!items.length) { alert('Кошик порожній'); return; }
        const res = await fetch('/api/orders', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', ...getAuthHeaders() },
            body: JSON.stringify({ shippingAddress: address, items })
        });
        if (res.status === 201) {
            alert('✅ Замовлення оформлено!');
            cart = {}; updateCartDisplay();
            document.getElementById('address').value = '';
            cartSidebar.classList.remove('open');
        } else {
            alert('Помилка оформлення замовлення');
        }
    }

    // --- Товари ---
    async function fetchProducts() {
        let url = `/api/products?type=${currentType}`;
        if (currentSort) url += `&sort=${currentSort}`;
        try {
            const res = await fetch(url);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const products = await res.json();
            renderProducts(products);
        } catch(e) {
            productsDiv.innerHTML = '<p style="color:red;">Помилка завантаження товарів</p>';
        }
    }

    function renderProducts(products) {
        if (!products.length) { productsDiv.innerHTML = '<p>Немає товарів у цій категорії</p>'; return; }
        productsDiv.innerHTML = products.map(p => `
            <div class="product-card">
                <img src="${p.imageUrl || 'https://via.placeholder.com/200x180?text=Fishing'}" class="product-img" onerror="this.src='https://via.placeholder.com/200x180?text=Fishing'">
                <div class="product-title">${escapeHtml(p.name)}</div>
                <div class="product-price">${p.price} ₴</div>
                <button class="buy-btn" onclick='addToCart(${JSON.stringify(p)})'>➕ Додати</button>
                ${currentUser && currentUser.role === 'ADMIN' ? `<button class="admin-edit-btn" onclick="deleteProduct(${p.id})">❌ Видалити</button>` : ''}
            </div>
        `).join('');
    }

    async function deleteProduct(id) {
        if (!confirm('Видалити товар?')) return;
        const res = await fetch(`/api/products/${id}`, { method: 'DELETE', headers: getAuthHeaders() });
        if (res.ok) fetchProducts(); else alert('Помилка видалення');
    }

    async function createProduct(product) {
        const res = await fetch('/api/products', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', ...getAuthHeaders() },
            body: JSON.stringify(product)
        });
        if (res.status === 201) { alert('✅ Товар додано'); fetchProducts(); closeAdminModal(); }
        else alert('Помилка додавання товару');
    }

    // --- Категорії ---
    const categories = [
        { type: 'ROD', name: '🎣 Вудлища' }, { type: 'REEL', name: '🔄 Котушки' },
        { type: 'LINE', name: '🧵 Шнури' }, { type: 'HOOK', name: '🪝 Гачки' }, { type: 'LURE', name: '🐟 Воблери' }
    ];
    function initCategories() {
        categoryContainer.innerHTML = '';
        categories.forEach(cat => {
            const btn = document.createElement('button');
            btn.innerText = cat.name;
            btn.classList.add('cat-btn');
            if (currentType === cat.type) btn.classList.add('active');
            btn.onclick = () => { currentType = cat.type; fetchProducts(); document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); };
            categoryContainer.appendChild(btn);
        });
    }

    // --- Модалка адміна ---
    function openAdminModal() { if (currentUser && currentUser.role === 'ADMIN') { document.getElementById('admin-modal').style.display = 'block'; document.getElementById('overlay').style.display = 'block'; } }
    function closeAdminModal() { document.getElementById('admin-modal').style.display = 'none'; document.getElementById('overlay').style.display = 'none'; }
    if (adminFloat) adminFloat.onclick = openAdminModal;

    document.getElementById('save-product-btn').onclick = () => {
        const prod = {
            name: document.getElementById('prod-name').value,
            description: document.getElementById('prod-desc').value,
            price: parseFloat(document.getElementById('prod-price').value),
            type: document.getElementById('prod-type').value,
            imageUrl: document.getElementById('prod-image').value,
            stock: parseInt(document.getElementById('prod-stock').value) || 0
        };
        if (!prod.name || !prod.price) { alert('Назва і ціна обов\'язкові'); return; }
        createProduct(prod);
    };
    document.getElementById('close-modal-btn').onclick = closeAdminModal;
    document.getElementById('overlay').onclick = closeAdminModal;

    // --- Події (кошик, сортування) ---
    document.getElementById('cart-icon').onclick = () => cartSidebar.classList.add('open');
    document.getElementById('close-cart').onclick = () => cartSidebar.classList.remove('open');
    document.getElementById('checkout-btn').onclick = checkout;
    document.getElementById('sort-select').onchange = (e) => { currentSort = e.target.value; fetchProducts(); };

    function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }

    // --- Ініціалізація ---
    initCategories();
    loadCart();
    restoreSession();
    fetchProducts();
</script>
</body>
</html>
