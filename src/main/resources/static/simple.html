<!DOCTYPE html>
<html>
<head><title>Простий тест логіну</title></head>
<body>
<h2>Тест логіну</h2>
<input id="user" value="admin"><br>
<input id="pass" type="password" value="admin123"><br>
<button id="login">Увійти</button>
<pre id="result"></pre>

<script>
    document.getElementById('login').onclick = async function() {
        const user = document.getElementById('user').value;
        const pass = document.getElementById('pass').value;
        try {
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify({username: user, password: pass})
            });
            const data = await res.json();
            document.getElementById('result').innerText = JSON.stringify(data, null, 2);
        } catch(e) {
            document.getElementById('result').innerText = 'Помилка: ' + e.message;
        }
    };
</script>
</body>
</html>
