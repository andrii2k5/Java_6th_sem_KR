spring.application.name=FishMarket
server.port=8080

spring.datasource.url=jdbc:postgresql://postgres_db:5432/fishmarket
spring.datasource.username=fishuser
spring.datasource.password=fishpass
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.springframework=INFO
logging.level.com.fishmarket=DEBUG

springdoc.swagger-ui.path=/swagger-ui.html

app.jwtSecret=b5f5937a6f7b5b9e5c7e3d1a9f2c8d4e1a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5
app.jwtExpirationMs=86400000